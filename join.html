<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="supabase-url" content="https://wygdmapqwqjqrmrksaef.supabase.co" />

  <meta charset="UTF-8" />
  <title>Join Studio | Music Amplified</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="join.css" />
  <meta name="theme-color" content="#0B4F8A" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Music Amplified" />
  <link rel="icon" type="image/png" sizes="192x192" href="images/pwa/icon-192.png?v=20260421a" />
  
  <link rel="apple-touch-icon" href="images/pwa/apple-touch-icon.png?v=20260421a" />
</head>
<body class="white-page join-page">
  <div id="envBadge" class="env-badge" style="display:none;"></div>

  <main class="app join-shell">
    <section class="join-card" aria-labelledby="inviteWelcome">
      <img src="images/logos/amplified.png" alt="Music Amplified" class="join-logo" />

      <div class="join-header">
        <p class="join-kicker">Studio invitation</p>
        <h1 id="inviteWelcome">Welcome to this studio</h1>
        <p id="studioNameDisplay" class="join-studio-name">Music Amplified</p>
        <p id="invitePrompt" class="join-prompt">Validate your invite to log in or create an account.</p>
      </div>

      <section class="join-invite-panel" aria-labelledby="inviteHeading">
        <h2 id="inviteHeading">Join with Invite</h2>

        <div id="manualTokenGroup" class="join-token-group">
          <label for="inviteToken">Invite Token</label>
          <input id="inviteToken" type="text" placeholder="Paste your invite token" />
        </div>

        <div class="join-status-wrap">
          <p id="inviteStatus" class="join-status">Paste an invite token to continue.</p>
          <p id="inviteDetails" class="join-details"></p>
          <p id="inviteError" class="join-error" style="display:none;"></p>
        </div>

        <div id="validateRow" class="button-row join-validate-row" style="display:none;">
          <button id="validateInviteBtn" type="button" class="blue-button">Validate Invite</button>
        </div>
      </section>

      <section id="authPanels" class="join-auth-panel" style="display:none;">
        <div class="join-auth-grid">
          <form id="loginFormInline" class="join-auth-card">
            <h2>Log in</h2>
          <label for="loginEmailInline">Email</label>
          <input id="loginEmailInline" type="email" autocomplete="email" />

          <label for="loginPasswordInline">Password</label>
          <input id="loginPasswordInline" type="password" autocomplete="current-password" />

            <p id="loginErrorInline" class="join-error" style="display:none;"></p>
            <p id="loginSuccessInline" class="join-success" style="display:none;"></p>

            <div class="button-row join-action-row">
              <button type="submit" class="blue-button">Log in</button>
            </div>
          </form>

          <form id="signupFormInline" class="join-auth-card">
            <h2>Create account</h2>
            <label for="signupEmailInline">Email</label>
            <input id="signupEmailInline" type="email" autocomplete="email" />

            <label for="signupPasswordInline">Password</label>
            <input id="signupPasswordInline" type="password" autocomplete="new-password" />

            <p id="signupErrorInline" class="join-error" style="display:none;"></p>
            <p id="signupSuccessInline" class="join-success" style="display:none;"></p>

            <div class="button-row join-action-row">
              <button type="submit" class="blue-button">Create account</button>
            </div>
          </form>
        </div>
      </section>

      <div class="join-back-row">
        <button id="backBtn" type="button" class="blue-button join-secondary-button">Back</button>
      </div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="supabase-config.js"></script>
  <script type="module" src="supabaseClient.js"></script>
  <script type="module" src="utils.js"></script>
  <script type="module" src="studio-routing.js"></script>
  <script type="module" src="nav.js"></script>

  <script type="module" src="join.js"></script>
  <script type="module" src="pwa-install.js"></script>
</body>
</html>
